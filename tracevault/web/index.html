<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceVault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l11 4v8c0 7-5 12-11 14C10 27 5 22 5 15V7z' fill='%2322507E'/%3E%3Cpath d='M11 16l4 4 7-8' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#16212F; --slate:#4A5A6E; --fog:#EDF0F4; --vellum:#FAFBFC; --surface:#FFFFFF; --line:#D6DCE4;
  --seal:#22507E; --seal-ink:#FFFFFF; --ok:#17724A; --ok-bg:#E3F3EA; --warn:#8A5200; --warn-bg:#FBEFD5;
  --bad:#B3261E; --bad-bg:#FBE4E2; --shadow:0 1px 2px rgba(22,33,47,.06),0 8px 24px rgba(22,33,47,.08);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ink:#E8EDF3; --slate:#9BAABB; --fog:#0F1620; --vellum:#131C27; --surface:#18222F; --line:#2B3949;
  --seal:#6FA3D8; --seal-ink:#0F1620; --ok:#5CCB92; --ok-bg:#12301F; --warn:#F0B35A; --warn-bg:#34260F;
  --bad:#FF8A80; --bad-bg:#3A1816; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light dark}
body{margin:0;background:var(--fog);color:var(--ink);font:16px/1.5 var(--sans)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.2;margin:0}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--seal);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--slate)}
svg.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;gap:.5rem;min-height:40px;padding:.45rem 1rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--slate)}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:32px;padding:.2rem .65rem;font-size:.875rem}
.btn[disabled]{opacity:.55;cursor:progress}
.field{display:grid;gap:.3rem;margin-bottom:1rem}
.field label{font-weight:600;font-size:.9rem}
.field input,.field select{min-height:44px;padding:.5rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.err{color:var(--bad);font-size:.9rem;min-height:1.4em;margin:.2rem 0 .7rem}
.spin{width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.login-art{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:2.5rem;padding:3rem 3.5rem;color:#EAF0F7;
  background:radial-gradient(900px 520px at 12% 8%,#27466b 0%,rgba(39,70,107,0) 62%),#16212F}
.login-art .brand{color:#fff;position:relative}
.login-art .pitch{position:relative;z-index:1;display:grid;gap:2rem;max-width:30rem}
.login-art h1{font-size:clamp(2.2rem,4vw,3.2rem);line-height:1.08;color:#fff}
.points{list-style:none;margin:0;padding:0;display:grid;gap:1.1rem}
.points li{display:flex;gap:.9rem;align-items:flex-start;color:#C3D0E0;line-height:1.45}
.points .pi{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;background:rgba(111,163,216,.16);color:#9CC3EA}
.points .pi svg{width:1.2rem;height:1.2rem}
.login-art svg.seal{position:absolute;right:-150px;bottom:-150px;width:440px;height:440px;opacity:.12;pointer-events:none;z-index:0}
.login-form{display:grid;place-items:center;padding:2rem;background:var(--vellum)}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2.25rem 2rem 1.75rem;box-shadow:var(--shadow)}
.login-card h2{font-size:1.65rem;margin-bottom:.35rem}
.login-card .lead{color:var(--slate);margin-bottom:1.6rem}
.login-card .foot{display:flex;gap:.5rem;align-items:center;justify-content:center;color:var(--slate);font-size:.85rem;margin-top:1.4rem;padding-top:1.1rem;border-top:1px solid var(--line)}
.pw{position:relative}
.pw input{padding-right:4.2rem}
.pw button{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--seal);font-weight:600;padding:.4rem .6rem;border-radius:6px}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--serif);font-weight:700;font-size:1.25rem}
.brand svg{width:28px;height:28px}
@media(max-width:860px){.login{grid-template-columns:1fr}.login-art{padding:1.5rem 1.5rem 1.75rem;gap:1.25rem}.login-art .points{display:none}.login-art svg.seal{width:240px;height:240px;right:-70px;bottom:-70px}.login-form{padding:1.25rem}.login-card{padding:1.75rem 1.4rem 1.4rem}}

/* shell */
.top{display:flex;align-items:center;gap:1rem;padding:.6rem 1.25rem;background:#16212F;border-bottom:1px solid #243247;color:#EAF0F7;flex-wrap:wrap}
.top .brand{color:#fff}
.top .who{margin-left:auto;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.top .btn{background:transparent;border-color:#3A4B60;color:#EAF0F7}
.rolebadge{font-size:.85rem;padding:.15rem .6rem;border-radius:99px;background:#2A3B52;color:#D5E2F2}
nav.tabs{display:flex;gap:.25rem;padding:0 1.25rem;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.8rem .9rem;cursor:pointer;font-weight:600;color:var(--slate);white-space:nowrap}
nav.tabs button[aria-current=page]{color:var(--ink);border-bottom-color:var(--seal)}
main>*{min-width:0}
main{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem 4rem;display:grid;gap:1.75rem}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:1.25rem}

/* figures strip */
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}
.figures>div{padding:1rem 1.25rem;border-left:1px solid var(--line)}
.figures>div:first-child{border-left:0}
.figures b{display:block;font:600 2rem/1.1 var(--serif)}
@media(max-width:600px){.figures>div{border-left:0;border-top:1px solid var(--line)}.figures>div:first-child{border-top:0}}

/* drop zone */
.drop{display:grid;place-items:center;text-align:center;gap:.5rem;padding:2.5rem 1.5rem;border:2px dashed var(--slate);border-radius:14px;background:var(--surface);cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{border-color:var(--seal);background:color-mix(in srgb,var(--seal) 8%,var(--surface))}
.drop.over{border-style:solid}
.drop svg{width:44px;height:44px;color:var(--seal)}
.drop strong{font:600 1.2rem var(--serif)}
.tray{display:grid;gap:.75rem;margin-top:1rem}
.up{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:1rem 1.25rem;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.up .name{font-weight:600;overflow-wrap:anywhere}
.up .bar{height:6px;border-radius:3px;background:var(--fog);overflow:hidden;margin-top:.5rem}
.up .bar i{display:block;height:100%;width:40%;background:var(--seal);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
.stamp{width:56px;height:56px;display:grid;place-items:center;border-radius:50%}
.stamp svg{width:32px;height:32px}
.up.done.verified{border-color:var(--ok);background:var(--ok-bg)} .up.done.inconclusive{border-color:var(--warn);background:var(--warn-bg)} .up.done.failed,.up.error{border-color:var(--bad);background:var(--bad-bg)}
.up.done .stamp{animation:stamp .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{from{transform:scale(1.8) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.verified .stamp{color:var(--ok)} .inconclusive .stamp{color:var(--warn)} .failed .stamp,.error .stamp{color:var(--bad)}
@media(max-width:560px){.up{grid-template-columns:auto 1fr}.up .act{grid-column:1/-1}}

/* tables */
.tablewrap{position:relative;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:.75rem 1rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.85rem;font-weight:600;color:var(--slate);background:var(--vellum);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--vellum)}
td.id{white-space:nowrap;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--slate)}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .65rem .2rem .45rem;border-radius:99px;font-weight:600;font-size:.9rem;white-space:nowrap}
.chip.verified{background:var(--ok-bg);color:var(--ok)} .chip.inconclusive{background:var(--warn-bg);color:var(--warn)} .chip.failed{background:var(--bad-bg);color:var(--bad)}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.toolbar input,.toolbar select{min-height:40px;padding:.4rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.toolbar input{flex:1;min-width:180px}

/* ledger */
.health{display:flex;gap:1.25rem;align-items:center;padding:1.5rem}
.health .stamp{width:84px;height:84px}.health .stamp svg{width:50px;height:50px}
.health.verified{background:var(--ok-bg)} .health.failed{background:var(--bad-bg)}
.health.verified .stamp{color:var(--ok)} .health.failed .stamp{color:var(--bad)}
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0}
.node{padding:1rem 1.25rem;border-left:1px solid var(--line);display:grid;gap:.4rem;align-content:start}
.node:first-child{border-left:0}
.dot{width:.7em;height:.7em;border-radius:50%;display:inline-block;margin-right:.4rem;background:var(--ok)} .dot.off{background:var(--bad)}

/* dialogs & toast */
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 2rem));max-height:calc(100vh - 2rem);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,16,24,.55)}
dialog .hd{display:flex;justify-content:space-between;align-items:start;gap:1rem;padding:1.25rem 1.25rem .5rem}
dialog .bd{padding:.5rem 1.25rem 1.25rem;overflow:auto;max-height:70vh}
dialog .ft{display:flex;justify-content:flex-end;gap:.5rem;padding:1rem 1.25rem;border-top:1px solid var(--line);flex-wrap:wrap}
.verdict{display:flex;gap:1rem;align-items:center;padding:1rem;border-radius:10px;margin-bottom:1rem}
.verdict.verified{background:var(--ok-bg);color:var(--ok)} .verdict.inconclusive{background:var(--warn-bg);color:var(--warn)} .verdict.failed{background:var(--bad-bg);color:var(--bad)}
.verdict .stamp{width:52px;height:52px} .verdict p{color:var(--ink)}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1rem;margin:0 0 1rem}
dl.facts dt{color:var(--slate)} dl.facts dd{margin:0;overflow-wrap:anywhere}
ul.checks{list-style:none;padding:0;margin:0;display:grid;gap:.5rem}
ul.checks li{display:flex;gap:.6rem;align-items:start}
ul.checks .ok{color:var(--ok)} ul.checks .no{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);display:grid;gap:.5rem;z-index:50;width:min(480px,calc(100vw - 2rem))}
#toast div{background:var(--ink);color:var(--vellum);padding:.7rem 1rem;border-radius:10px;box-shadow:var(--shadow)}
#toast div.bad{background:var(--bad);color:#fff}

/* v3.1 additions */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
td code.h{white-space:nowrap}
code.h{font:.8rem/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--fog);padding:.1rem .4rem;border-radius:4px;overflow-wrap:anywhere}
.techswitch{display:flex;align-items:center;gap:.4rem;font-size:.875rem;color:#C9D6E6;cursor:pointer}
.techswitch input{width:1rem;height:1rem}
.banner{display:flex;gap:1rem;align-items:center;padding:1rem 1.25rem;border-radius:12px;border:1px solid var(--line)}
.banner.verified{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)} .banner.failed{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)} .banner.inconclusive{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.banner p,.banner h3{color:var(--ink)}
.banner .stamp{width:48px;height:48px}
.hint{font-size:.9rem;color:var(--slate);margin-top:.35rem}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:.25rem}
.timeline li{display:flex;gap:.75rem;align-items:center;padding:.6rem .75rem;border-radius:8px;color:var(--slate)}
.timeline li .dotk{width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.timeline li.active{color:var(--ink);background:var(--fog)} .timeline li.active .dotk{border-color:var(--seal)}
.timeline li.done{color:var(--ink)} .timeline li.done .dotk{background:var(--ok);border-color:var(--ok);color:#fff}
.timeline li.failed{color:var(--bad);background:var(--bad-bg)} .timeline li.failed .dotk{background:var(--bad);border-color:var(--bad);color:#fff}
.timeline svg{width:.95rem;height:.95rem}
.viewer{display:grid;gap:1rem;justify-items:center;padding:1.25rem;background:var(--fog);border-radius:12px}
.viewer figure{margin:0;background:#fff;padding:10px;border-radius:8px;box-shadow:var(--shadow);width:100%;max-width:560px}
.viewer img{width:100%;height:auto;display:block;border:1px solid #cbd5e1;border-radius:4px}
.viewer figcaption{font-size:.8rem;color:#475569;margin-bottom:6px;display:flex;justify-content:space-between}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.steps li{display:flex;gap:.6rem;align-items:start}
.steps .ok{color:var(--ok)} .steps .no{color:var(--bad)}
.pick{display:grid;gap:.4rem;border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;max-height:240px;overflow:auto;background:var(--surface)}
.pick label{display:flex;gap:.6rem;align-items:center;cursor:pointer}
.pick input{width:1.1rem;height:1.1rem}
.cardrow{display:grid;gap:.6rem;padding:1.25rem;align-content:start}
.result{display:grid;gap:1rem}
.list{margin:.5rem 0 0;padding-left:1.1rem;color:var(--slate);display:grid;gap:.35rem}
.list b{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:640px){
.evt thead{display:none}.evt,.evt tbody{display:block;width:100%;min-width:0}
.evt tr{display:grid;grid-template-columns:1fr auto;gap:.25rem .75rem;padding:.8rem 1rem;border-top:1px solid var(--line)}.evt tr:first-child{border-top:0}
.evt td{display:block;padding:0;border:0;white-space:normal}
.evt .c-id{grid-column:1;grid-row:1;font-size:.95rem;word-break:break-all}.evt .c-st{grid-column:2;grid-row:1;justify-self:end}
.evt .c-date,.evt .c-sub{grid-row:2;font-size:.85rem;color:var(--slate)}.evt .c-date{grid-column:1}.evt .c-sub{grid-column:2;justify-self:end}
.evt .c-act{display:none}}
</style>
</head>

<div id="app"></div>

<script>
"use strict";
/* ---------- tiny helpers ---------- */
const S = { token: null, user: null, role: null, tab: null, tech: false, shareDoc: null };
const store = {

const SVGNS = 'http://www.w3.org/2000/svg';

const fmtDate = s => { const d = new Date(s); return isNaN(d) ? String(s || '') : d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}); };
const fmtEpoch = t => fmtDate(new Date(t*1000));
const short = (x, n=14) => { x = String(x || ''); return h('code',{class:'h',title:x}, x.length > n ? x.slice(0,n) + '…' : x); };
function toast(msg, bad){ const t = document.getElementById('toast'); const d = h('div',{class:bad?'bad':''},msg); t.append(d); while (t.children.length > 3) t.firstChild.remove(); setTimeout(()=>d.remove(), bad?7000:3500); }
const isStaff = () => S.role !== 'submitter';

async function api(path, opt = {}){
  const headers = {};
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  if (opt.body) headers['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch(path, { method: opt.method || 'GET', headers, body: opt.body ? JSON.stringify(opt.body) : undefined }); }
  catch { throw new Error('Cannot reach the server. Check your connection and try again.'); }
  if (r.status === 401 && S.token && !opt.noLogout){ logout('Your session ended. Sign in again.'); throw new Error('Session ended'); }
  if (!r.ok){
    let d = null; try { d = await r.json(); } catch {}
    const det = d && d.detail;
    const e = new Error(typeof det === 'string' ? det : Array.isArray(det) ? det.map(x => x.msg).join('. ') : `Something went wrong (${r.status}).`);
    e.data = d; e.status = r.status; throw e;
  }
  return opt.blob ? r.blob() : r.json();
}
async function download(path, name, btn){
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing…';
  try { saveBlob(await api(path, { blob: true }), name); } catch(e){ toast(e.message, true); }
  btn.disabled = false; btn.textContent = old;
}
function saveBlob(blob, name){
  const a = h('a',{href:URL.createObjectURL(blob), download:name}); document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
const b64ToBlob = (b64, type) => { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new Blob([u],{type}); };
const fileToB64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('This file could not be read.')); r.readAsDataURL(f); });

/* ---------- evidence upload zone (drag & drop) ---------- */
function evidenceUploader(onDone){
  const MAX = 25 * 1024 * 1024;
  const tray = h('div',{class:'tray','aria-live':'polite'});
  const input = h('input',{type:'file',multiple:true,class:'sr',id:'file',tabindex:'-1',accept:'.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.odt,.odp,.ods,.rtf,.txt,.csv,.png,.jpg,.jpeg,.gif,.bmp,.webp,.tif,.tiff,application/pdf,image/*'});
  const zone = h('label',{class:'drop',for:'file',tabindex:'0'},
    icon('upload'), h('strong',{},'Drop files here to check them'), h('span',{class:'muted'},'PDF, Word, PowerPoint, Excel, photo or scan. Click to choose files (up to 25 MB each).'));
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); input.click(); } });
  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('over'); }));
  zone.addEventListener('drop', e => handle([...e.dataTransfer.files]));
  input.addEventListener('change', () => { handle([...input.files]); input.value = ''; });
  let chain = Promise.resolve();
  function handle(files){ files.forEach(f => { chain = chain.then(() => upload(f)); }); }
  async function upload(file){
    const row = h('div',{class:'up'}); tray.prepend(row);
    const set = (cls, lead, title, sub, act) => { row.className = 'up ' + cls; row.replaceChildren(lead, h('div',{}, h('div',{class:'name'}, title), sub), act || h('span')); };
    const fail = msg => set('error', stamp('failed'), file.name, h('div',{}, msg), h('button',{class:'btn small',onclick:()=>row.remove()},'Dismiss'));
    if (file.size > MAX) return fail('This file is larger than 25 MB. Send a smaller copy.');
    if (!file.size) return fail('This file is empty.');
    set('busy', h('span',{class:'stamp'}, h('span',{class:'spin'})), file.name, h('div',{}, h('span',{class:'muted'},'Checking against the ledger…'), h('div',{class:'bar'}, h('i'))));
    try {
      const res = await api('/submitter/evidence',{method:'POST',body:{filename:file.name,content_b64:await fileToB64(file)}});
      set('done '+res.verdict, stamp(res.verdict), file.name, h('div',{}, h('strong',{}, res.headline + '. '), res.explain),
        h('div',{class:'act'}, h('button',{class:'btn small',onclick:()=>openEvidence(res)},'See details')));
      onDone && onDone(res);
    } catch(e){ if (e.message !== 'Session ended') fail(e.message); }
  }
  return { zone, input, tray };
}

}

function openDocPanel(host, pkg){
  const pass = h('input',{id:'dp',type:'password',autocomplete:'off',required:true});
  const err = h('p',{class:'err',role:'alert'});
  const go = h('button',{class:'btn primary',type:'submit'},'Unlock and open');
  const tl = h('ul',{class:'timeline','aria-label':'Progress'});
  const stepEls = {};
  Object.entries(STEP_TEXT).forEach(([k,label]) => { const li = h('li',{}, h('span',{class:'dotk'}), h('span',{}, label)); stepEls[k] = li; tl.append(li); });
  const setStep = (k, state) => { const li = stepEls[k]; li.className = state; const d = li.firstChild; d.replaceChildren(state==='done'?icon('check'):state==='failed'?icon('x'):''); };
  const result = h('div',{class:'result'});
  const form = h('form',{},
    h('div',{class:'field',style:'max-width:420px'}, h('label',{for:'dp'},'Your key passphrase'), pass, h('span',{class:'hint'},'Opening is recorded. Your copy carries an invisible mark that identifies you.')), err, go);
  host.replaceChildren(h('div',{class:'panel pad',style:'display:grid;gap:1.25rem;margin-top:1.5rem'}, h('h2',{}, 'Open “' + pkg.title + '”'), form, tl, result));
  pass.focus();
  form.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = ''; result.replaceChildren(); go.disabled = true; go.replaceChildren(h('span',{class:'spin'}), ' Opening…');
    Object.keys(stepEls).forEach(k => setStep(k,''));
    const play = async (steps, failedStep) => { for (const k of Object.keys(STEP_TEXT)){ const st = steps.find(s => s.step === k && s.status === 'done'); if (st){ setStep(k,'done'); await new Promise(r => setTimeout(r, 140)); } else { if (failedStep === k) setStep(k,'failed'); break; } } };
    try {
      const d = await api('/recipient/decrypt-and-release',{method:'POST',body:{document_id:pkg.document_id,keystore_passphrase:pass.value}, noLogout:true});
      const steps = d.steps.slice(); steps.push({step:'release',status:'done'});
      await play(steps);
      pass.value = '';
      const isPdf = d.extension === 'pdf', blob = b64ToBlob(d.protected_b64,d.media_type), url = URL.createObjectURL(blob);
      const verdictHost = h('div',{});
      const test = h('button',{class:'btn'},'Test this copy as if it leaked');
      test.onclick = async () => { test.disabled = true; test.textContent = 'Checking…';
        try { const r = await api('/submitter/evidence',{method:'POST',body:{filename:'my-opened-copy.'+d.extension,content_b64:d.protected_b64}});
          verdictHost.replaceChildren(h('div',{class:'banner '+r.verdict}, stamp(r.verdict), h('div',{}, h('h3',{}, r.headline), h('p',{}, r.verdict==='verified' ? 'If this copy ever leaked, it would be traced back to you.' : r.explain)), h('span',{class:'spacer'}), h('button',{class:'btn small',onclick:()=>openEvidence(r)},'See details')));
        } catch(ex){ toast(ex.message,true); } test.disabled = false; test.textContent = 'Test this copy as if it leaked'; };
      result.replaceChildren(
        h('div',{class:'banner verified'}, stamp('verified'), h('div',{}, h('h3',{},'Document released'), h('p',{}, `Recorded in the ledger as block #${d.record.index}, approved by ${Object.keys(d.record.attestations).length} of 4 nodes.`))),
        h('div',{class:'row'}, h('button',{class:'btn primary',onclick:()=>saveBlob(blob, `${pkg.title.replace(/[^\w.-]+/g,'_')}.${d.extension}`)},isPdf?'Download protected PDF':'Download protected image'), h('button',{class:'btn',onclick:()=>window.open(url,'_blank')},'Open in new tab'), test),
        verdictHost,
        h('div',{class:'viewer'}, d.page_images.map((img,i) => h('figure',{}, h('figcaption',{}, h('span',{}, `Page ${i+1} of ${d.page_images.length}`), h('span',{}, 'Tracking mark embedded')), h('img',{src:'data:'+d.image_media_type+';base64,'+img, alt:`Page ${i+1}`})))));
    } catch(ex){
      const steps = (ex.data && ex.data.steps) || [];
      await play(steps, ex.data && ex.data.step);
      err.textContent = ex.status === 401 && ex.message.includes('passphrase') ? 'That passphrase is not correct. Try again.' :
        ex.data && ex.data.step ? 'The document was not released: ' + ex.message.replace(/^release denied at '[^']*': /,'') : ex.message;
      if (ex.status === 401 && !ex.message.includes('passphrase')) logout('Your session ended. Sign in again.');
    }
    go.disabled = false; go.textContent = 'Unlock and open';
  });
}

      {name:'password',label:'Temporary password (at least 8 characters)',type:'password',auto:'new-password',min:8},
      {name:'role',label:'Role',options:Object.entries(ROLE_TEXT)}],'Add user',
      async v=>{ await api('/admin/users',{method:'POST',body:v}); toast('User added'); draw(); })},'Add user')),
    h('div',{class:'tablewrap'}, h('table',{}, h('thead',{}, h('tr',{}, h('th',{},'Username'), h('th',{},'Role'), h('th',{},'Added'), h('th',{}, h('span',{class:'sr'},'Actions')))),
      h('tbody',{}, u.map(x => {
        const sel = h('select',{'aria-label':'Role for '+x.username}, Object.entries(ROLE_TEXT).map(([v,l]) => h('option',{value:v,selected:v===x.role?true:null}, l)));
        sel.onchange = async () => { try { await api(`/admin/users/${encodeURIComponent(x.username)}/role`,{method:'POST',body:{role:sel.value}}); toast(`${x.username} is now ${ROLE_TEXT[sel.value]}`); } catch(e){ toast(e.message,true); } draw(); };
        return h('tr',{}, h('td',{class:'id'}, x.username), h('td',{}, sel), h('td',{}, fmtDate(x.created_at)),
          h('td',{style:'white-space:nowrap;text-align:right'},
            h('button',{class:'btn small',onclick:()=>formDialog('Reset password for '+x.username,[{name:'password',label:'New password (at least 8 characters)',type:'password',auto:'new-password',min:8}],'Reset password',
              async v=>{ await api(`/admin/users/${encodeURIComponent(x.username)}/password`,{method:'POST',body:v}); toast('Password reset'); })},'Reset password'), ' ',
            h('button',{class:'btn small danger',onclick:async()=>{ if(!confirm(`Delete ${x.username}? They will be signed out immediately.`)) return; try{ await api('/admin/users/'+encodeURIComponent(x.username),{method:'DELETE'}); toast('User deleted'); }catch(e){ toast(e.message,true);} draw(); }},'Delete')));
      })))));
}

/* ---------- routing: role decides the workspace ---------- */
function route(){
  if (!S.token) return renderLogin();
  ({ submitter: submitterView, auditor: auditorView, admin: adminView }[S.role] || (() => logout('Unknown role.')))();
}
(function boot(){
  try { const s = JSON.parse(store.get('tv') || 'null'); if (s && s.t){ S.token = s.t; S.user = s.u; S.role = s.r; } } catch {}
  S.tech = store.get('tvtech') === '1';
  route();
})();
</script>
